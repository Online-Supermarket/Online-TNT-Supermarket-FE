name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build React frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate API base URL
        env:
          API_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$API_URL" ] || [ "$API_URL" = "https://example.invalid/api" ]; then
            echo "::error::Repository variable VITE_API_BASE_URL is not configured or is using placeholder https://example.invalid/api."
            echo "Please set repository variable VITE_API_BASE_URL to the production gateway endpoint (e.g. https://tnt-gateway-ovindu.azurewebsites.net/api)."
            exit 1
          fi
          if [[ "$API_URL" != https://*/api ]]; then
            echo "::error::VITE_API_BASE_URL must be an HTTPS /api endpoint (e.g. https://tnt-gateway-ovindu.azurewebsites.net/api)."
            exit 1
          fi
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Verify compiled deployment files
        run: node scripts/verify-static-build.mjs dist
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
  docker:
    name: Build frontend image
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: marketflow-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
