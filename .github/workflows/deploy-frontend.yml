name: Deploy frontend to Azure Static Web Apps

on:
  workflow_run:
    workflows: [Frontend CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.AZURE_STATIC_WEB_APPS_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      STATIC_WEB_APP_URL: ${{ vars.AZURE_STATIC_WEB_APPS_URL }}
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate deployment configuration
        run: |
          test -n "$VITE_API_BASE_URL"
          test -n "$STATIC_WEB_APP_URL"
          test -n "$AZURE_STATIC_WEB_APPS_API_TOKEN"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
      - run: curl --fail --retry 6 --retry-all-errors --retry-delay 5 "$STATIC_WEB_APP_URL"
