name: Deploy frontend to Azure Static Web Apps

on:
  workflow_run:
    workflows: [Frontend CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Verify compiled deployment files
        run: node scripts/verify-static-build.mjs dist

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # The build already ran above; upload its output directly.
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Verify deployed JavaScript
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          test -n "$DEPLOYED_URL"
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-static-build.mjs "$DEPLOYED_URL"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          exit 1
