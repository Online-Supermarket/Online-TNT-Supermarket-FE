name: Deploy Sprint 01-02 Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - index.html
      - package.json
      - package-lock.json
      - .github/workflows/deploy-frontend.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: frontend-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AZURE_STATIC_WEB_APPS_DEPLOY_ENABLED == 'true'
    name: Deploy React frontend to Azure Static Web Apps
    runs-on: ubuntu-latest
    environment: staging
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      STATIC_WEB_APP_URL: ${{ vars.AZURE_STATIC_WEB_APPS_URL }}
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate staging configuration
        run: |
          test -n "$VITE_API_BASE_URL"
          test -n "$STATIC_WEB_APP_URL"
          test -n "$AZURE_STATIC_WEB_APPS_API_TOKEN"
      - run: npm ci
      - name: Build frontend with the staging gateway URL
        run: npm run build
      - name: Deploy built static files
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
      - name: Verify the deployed frontend
        run: curl --fail --retry 6 --retry-all-errors --retry-delay 5 "$STATIC_WEB_APP_URL"
